<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرعة الأرقام 🎲</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box {
    background: white;
    width: 90%;
    max-width: 500px;
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px #0002;
}

h1 {
    margin-bottom: 10px;
}

#number {
    font-size: 90px;
    font-weight: bold;
    margin: 35px 0;
}

button {
    border: none;
    border-radius: 15px;
    padding: 15px 25px;
    margin: 5px;
    font-size: 18px;
    cursor: pointer;
}

.draw {
    background: #222;
    color: white;
}

.reset {
    background: #ddd;
}

#history {
    margin-top: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
}

.num {
    background: #eee;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

<h1>🎲 قرعة الأرقام</h1>

<p>اضغطي حتى يطلع رقم عشوائي من 1 إلى 100</p>

<div id="number">—</div>

<button class="draw" onclick="drawNumber()">
🎲 اسحب رقم
</button>

<button class="reset" onclick="resetGame()">
♻️ إعادة
</button>

<p id="count">المسحوب: 0 / 100</p>

<div id="history"></div>

</div>

<script>

let numbers = [];

for (let i = 1; i <= 100; i++) {
    numbers.push(i);
}

let drawn = [];

function drawNumber() {

    if (numbers.length === 0) {
        document.getElementById("number").innerText = "خلصت 🎉";
        return;
    }

    let randomIndex = Math.floor(Math.random() * numbers.length);

    let selected = numbers.splice(randomIndex, 1)[0];

    drawn.push(selected);

    document.getElementById("number").innerText = selected;

    document.getElementById("count").innerText =
        "المسحوب: " + drawn.length + " / 100";

    document.getElementById("history").innerHTML =
        drawn.map(n => `<span class="num">${n}</span>`).join("");
}

function resetGame() {

    numbers = [];

    for (let i = 1; i <= 100; i++) {
        numbers.push(i);
    }

    drawn = [];

    document.getElementById("number").innerText = "—";

    document.getElementById("count").innerText =
        "المسحوب: 0 / 100";

    document.getElementById("history").innerHTML = "";
}

</script>

</body>
</html>
